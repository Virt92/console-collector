# fly.toml for Console Collector backend deploy.
# Provision Postgres separately with `fly pg create` and attach via `fly pg attach`.

app = "console-collector-virt92"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/consoles"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
