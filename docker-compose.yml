services:
  db:
    image: postgres:16-alpine
    container_name: console-collector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console_dev_password
      POSTGRES_DB: console_collector
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console_collector"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: console-collector-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://console:console_dev_password@db:5432/console_collector
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
      FAL_API_KEY: ${FAL_API_KEY}
      PORT: "3000"
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  db_data:
